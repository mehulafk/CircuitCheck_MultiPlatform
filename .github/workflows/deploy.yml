name: Deploy full application to server
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Published image tag (main, vX.Y.Z, or sha-<full commit>)'
        required: true
        default: main
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, circuitcheck-production]
    environment: production
    timeout-minutes: 20
    env:
      CIRCUITCHECK_DOMAIN: ${{ vars.CIRCUITCHECK_DOMAIN }}
      CIRCUITCHECK_AUTH_USER: ${{ vars.CIRCUITCHECK_AUTH_USER || 'admin' }}
      CIRCUITCHECK_AUTH_HASH: ${{ secrets.CIRCUITCHECK_AUTH_HASH }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://api.openai.com/v1' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-4.1-mini' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Select published image
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || { echo 'Invalid image tag'; exit 1; }
          echo "CIRCUITCHECK_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$IMAGE_TAG" >> "$GITHUB_ENV"
      - name: Validate server configuration
        run: docker compose -f deploy/compose.yaml config --quiet
      - name: Pull and deploy
        run: |
          docker compose -f deploy/compose.yaml pull
          docker compose -f deploy/compose.yaml up -d --wait --wait-timeout 120
      - name: Check authentication boundary
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "https://$CIRCUITCHECK_DOMAIN/api/projects" || true)
            if [[ "$status" == 401 ]]; then
              echo "Deployment ready at https://$CIRCUITCHECK_DOMAIN (authentication required)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'HTTPS authentication check failed; inspect docker compose logs on the server.'
          exit 1
